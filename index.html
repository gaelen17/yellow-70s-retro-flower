<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Fleur 70s Jaune Solaire GSAP</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    body {
      background-color: #2c2c2c;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #flower-container {
      width: 450px;
      height: 450px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .retro-flower {
      width: 100%;
      height: 100%;
      transform-origin: center center;
    }

    /* Halo lumineux adapté aux teintes chaudes */
    .retro-flower .petals-layer path {
      filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 6px #ffb347);
    }
  </style>
</head>
<body>

  <div id="flower-container"></div>

  <script>
    const svgNS = "http://www.w3.org/2000/svg";
    const container = document.getElementById('flower-container');

    const flowerConfig = {
      centre: "#3d1c02", // Cœur marron chaleureux
      couches: [
        {
          path: "M0 0 C-15 -25 -20 -45 0 -50 C20 -45 15 -25 0 0 Z",
          couleurHex: "#ffb347", // Orange / jaune chaud de fond
          nbPetales: 8,
          scale: 1.25,
          rotationOffset: 0
        },
        {
          path: "M0 0 L -3 -30 C-10 -40 -5 -55 0 -58 C5 -55 10 -40 3 -30 L 0 0 Z",
          couleurHex: "#ffd166", // Jaune moutarde lumineux
          nbPetales: 16,
          scale: 0.95,
          rotationOffset: 11
        },
        {
          path: "M0 0 C-10 -15 -8 -30 0 -28 C8 -30 10 -15 0 0 Z",
          couleurHex: "#ffe6a7", // Jaune très clair / paille
          nbPetales: 8,
          scale: 0.7,
          rotationOffset: 5
        }
      ]
    };

    function createRetroFlower(config) {
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('class', 'retro-flower');
      svg.setAttribute('viewBox', '-80 -80 160 160');

      const mainGroup = document.createElementNS(svgNS, 'g');
      mainGroup.setAttribute('id', 'flower-body');

      config.couches.forEach((couche, index) => {
        const layerGroup = document.createElementNS(svgNS, 'g');
        layerGroup.setAttribute('class', `petals-layer layer-${index}`);
        layerGroup.setAttribute('fill', couche.couleurHex);
        layerGroup.setAttribute('stroke', couche.couleurHex);
        layerGroup.setAttribute('stroke-width', '1');
        
        layerGroup.setAttribute('transform', `scale(${couche.scale})`);

        for (let i = 0; i < couche.nbPetales; i++) {
          const angle = (360 / couche.nbPetales) * i + couche.rotationOffset;
          const path = document.createElementNS(svgNS, 'path');
          path.setAttribute('d', couche.path);
          path.setAttribute('transform', `rotate(${angle} 0 0)`);
          layerGroup.appendChild(path);
        }

        mainGroup.appendChild(layerGroup);
      });

      const circle = document.createElementNS(svgNS, 'circle');
      circle.setAttribute('cx', '0');
      circle.setAttribute('cy', '0');
      circle.setAttribute('r', '7');
      circle.setAttribute('fill', config.centre);
      mainGroup.appendChild(circle);

      svg.appendChild(mainGroup);
      return svg;
    }

    const myFlower = createRetroFlower(flowerConfig);
    container.appendChild(myFlower);

    // --- ANIMATIONS GSAP ---
    const flowerBody = myFlower.querySelector('#flower-body');

    gsap.fromTo(myFlower, 
      { opacity: 0, scale: 0 },
      { opacity: 1, scale: 1, duration: 1.5, ease: "back.out(1.7)" }
    );

    gsap.to(flowerBody, {
      rotation: "+=360",
      duration: 180,
      repeat: -1,
      ease: "none",
      transformOrigin: "center center"
    });
  </script>

</body>
</html>
